<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Banking Portal</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #0056b3; color: white; border: none; cursor: pointer; }
        button:hover { background: #003d82; }
        .info { background: #f4f4f4; padding: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Welcome to SecureBank</h1>

    <div class="info">
        <p>Please enter your account details below to proceed.</p>
        <p>Ensure you are on a secure connection.</p>
    </div>

    <form id="transfer-form" action="/submit" method="POST">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" placeholder="John Doe">
        </div>

        <div class="form-group">
            <label for="account_number">Account Number</label>
            <input type="text" id="account_number" name="account_number" placeholder="Enter your 10-digit account number">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="john.doe@example.com">
        </div>

        <div class="form-group">
            <label for="password">Security PIN / Password</label>
            <input type="password" id="password" name="password" placeholder="Enter PIN">
        </div>

        <button type="button" id="submit_btn" onclick="alert('Form submitted securely!')">Submit Transfer</button>
    </form>
</body>
</html>
